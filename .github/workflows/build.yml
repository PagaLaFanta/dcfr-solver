# Compila y pasa la batería en Windows, en cada cambio.
#
# SOLO Windows, a proposito. El programa se desarrolla, se usa y se reparte en
# Windows, y es donde esta el Discord al que va: mantener verdes tres
# plataformas cuesta tiempo de verdad y no lo pide nadie. El codigo tiene sus
# ramas de POSIX y el CMakeLists distingue WIN32, MinGW y MSVC, asi que
# probablemente compile fuera -- pero "probablemente" no se ofrece como si
# estuviera probado, y por eso no se dice que lo este.
#
# TODO EN POWERSHELL, y no en bash. El bash que traen los runners de Windows
# devolvia 127 -- "no encuentro eso" -- al lanzar un .exe que estaba ahi y que
# arrancaba perfectamente desde PowerShell dos pasos antes. No merece la pena
# averiguar por que: en una maquina Windows, la shell de Windows.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Que el binario arranca
        shell: pwsh
        run: |
          $exe = ".\build\Release\solver.exe"
          if (-not (Test-Path $exe)) { throw "no esta el binario en $exe" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
          # La salida SE GUARDA y luego se mira el codigo, en ese orden.
          # Encadenando con Select-Object -First, PowerShell corta la tuberia
          # antes de que el proceso termine y $LASTEXITCODE se queda VACIO: el
          # `-ne 0` daba verdadero y el paso fallaba con un --help que habia
          # impreso su texto sin una queja.
          $salida = & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "--help devolvio $LASTEXITCODE" }
          $salida | Select-Object -First 3

      - name: La batería de regresión
        shell: pwsh
        run: |
          # --check devuelve != 0 si algo falla, y eso es lo que hace fallar el
          # job. Se enseñan las ultimas lineas, que son las que llevan el
          # recuento; un fallo sale con su nombre entre ellas.
          $salida = & ".\build\Release\solver.exe" --check
          $codigo = $LASTEXITCODE
          $salida | Select-Object -Last 40
          if ($codigo -ne 0) { throw "la bateria fallo con $codigo" }

      - name: Que el banco de pruebas al menos arranque
        shell: pwsh
        run: |
          $salida = & ".\build\Release\solver.exe" --bench
          $codigo = $LASTEXITCODE
          $salida | Select-Object -Last 20
          if ($codigo -ne 0) { throw "--bench devolvio $codigo" }
