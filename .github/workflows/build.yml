# Compila y pasa la batería en Windows, en cada cambio.
#
# SOLO Windows, a proposito. El programa se desarrolla, se usa y se reparte en
# Windows, y es donde esta el Discord al que va: mantener verdes tres
# plataformas cuesta tiempo de verdad y no lo pide nadie. El codigo tiene sus
# ramas de POSIX y el CMakeLists distingue WIN32, MinGW y MSVC, asi que
# probablemente compile fuera -- pero "probablemente" no se ofrece como si
# estuviera probado, y por eso no se dice que lo este.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Encontrar el binario
        shell: bash
        run: |
          # MSVC lo mete en build/Release, los demás en build/
          for p in build/solver build/Release/solver.exe build/solver.exe; do
            if [ -x "$p" ]; then echo "SOLVER=$p" >> "$GITHUB_ENV"; exit 0; fi
          done
          echo "no encuentro el binario"; ls -R build | head -40; exit 1

      - name: Que el binario arranca
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Include solver.exe | Select-Object FullName, Length
          & ".\build\Release\solver.exe" --help
          Write-Host "codigo de salida: $LASTEXITCODE"

      - name: La batería de regresión
        shell: bash
        run: |
          "$SOLVER" --check | tail -40
          # --check devuelve != 0 si algo falla, y eso es lo que hace fallar el job.

      - name: Que el banco de pruebas al menos arranque
        shell: bash
        run: |
          "$SOLVER" --bench | tail -20
