# Publica binarios listos para usar cuando se etiqueta una version.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Los compila la propia CI en cada plataforma, asi que nadie tiene que tener las
# tres maquinas y nadie sube a mano un binario que no sabe de donde salio.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # hace falta para crear la Release

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: solver-windows-x64.exe
            ruta: build/Release/solver.exe

    steps:
      - uses: actions/checkout@v4

      # -march=native compilaria para la maquina de la CI, que no es la de quien
      # se lo descarga. Para publicar hay que renunciar a eso.
      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPORTABLE=ON

      - name: Compilar
        run: cmake --build build --config Release --parallel

      # En PowerShell y no en bash: el bash de los runners de Windows devuelve
      # 127 al lanzar un .exe que esta ahi y arranca. Ver build.yml.
      - name: Que pase la bateria antes de publicarse
        shell: pwsh
        run: |
          # Entera y sin capturar, igual que en build.yml: con las cinco
          # ultimas lineas, un fallo se queda sin nombre y no hay forma de
          # saber cual fue. Paso justo eso al etiquetar la v0.1.0.
          & "${{ matrix.ruta }}" --check
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) { throw "la bateria fallo con $codigo" }

      - name: Renombrar
        shell: pwsh
        run: Copy-Item "${{ matrix.ruta }}" "${{ matrix.nombre }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.nombre }}

  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }
      - run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Un solver de póker postflop para No Limit Hold'em que corre en tu
            propio ordenador y se maneja desde el navegador. Sin instalador, sin
            dependencias, sin cuenta y sin conexión: un solo `.exe`.

            **Descarga `solver-windows-x64.exe` y haz doble clic.** Se abre solo
            en tu navegador. Déjalo en una carpeta suya: al arrancar escribe un
            `saves/` a su lado, con los siete rangos que trae de fábrica dentro.

            La primera vez Windows avisará de que el programa no está firmado
            (SmartScreen): *Más información* → *Ejecutar de todas formas*. Firmar
            un ejecutable cuesta dinero todos los años y este proyecto no lo
            tiene; si prefieres no fiarte de un binario, compílalo tú, que son
            treinta segundos.

            Lo que trae:

            - Flop, turn o river con rangos completos, nodelocking, rake y
              objetivo de precisión.
            - **Entrenador**: juegas el spot contra la solución, con el consejo
              encendido o apagado, nota por EV perdido y repaso de cada decisión.
            - **No se abre con una sala de póker abierta** — PokerStars, GGPoker,
              Winamax, 888, CoinPoker o iPoker. Se estudia antes y después, no
              durante.
            - Scripts para resolver listas de boards de noche.

            Un árbol de flop grande pide mucha RAM: la interfaz te dice cuánta
            antes de construir nada. Empieza por un turn o un river si quieres
            verlo funcionando en dos segundos.

            Solo se publica Windows. El código tiene sus ramas de POSIX y
            probablemente compile fuera, pero "probablemente" no se ofrece como
            si estuviera probado.

            ---

            **English.** A postflop solver for No Limit Hold'em that runs on your
            own machine and is driven from your browser. One `.exe`, no
            installer, no dependencies, no account, no network.

            **Download `solver-windows-x64.exe` and double-click it.** Windows
            will warn that it is not signed (SmartScreen): *More info* → *Run
            anyway*. Code signing costs money every year and this project has
            none; build it yourself if you would rather not trust a binary.

            It solves the flop, turn or river with full ranges, locks nodes,
            takes rake, stops on an accuracy target, writes scripts to solve
            board lists overnight — and it lets you **play the solved tree
            against the solution**, scored by the EV you leave behind.

            It also **refuses to open next to a poker room**: every room's terms
            forbid real-time assistance, and this is for studying before and
            after, not during.

            Windows only. See the README for everything else.
